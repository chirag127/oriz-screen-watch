name: deploy

# Publish the static dashboard (dashboard/ + data/) to GitHub Pages whenever
# the dashboard or the committed data JSON changes on main.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build _site (dashboard + data)
        run: |
          mkdir -p _site
          cp dashboard/index.html dashboard/app.js dashboard/styles.css _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
